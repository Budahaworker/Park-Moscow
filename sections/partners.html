<section class="partners" aria-labelledby="partners-title" data-slider>
  <div class="container">
    <h2 class="h2" id="partners-title">Партнеры</h2>

    <ul class="partners__track" role="list" data-slider-track>
      <li class="partner"><img src="assets/logos/cod.svg" alt="КОД Сокольники" width="260" height="144" loading="lazy"></li>
      <li class="partner"><img src="assets/logos/ozon-fresh.svg" alt="Ozon fresh" width="260" height="144" loading="lazy"></li>
      <li class="partner"><img class="partner__img--mri" src="assets/logos/mri.png" alt="Музей русского импрессионизма" width="122" height="48" loading="lazy"></li>
      <li class="partner"><img src="assets/logos/soyuzmultfilm.png" alt="Союзмультфильм" width="260" height="144" loading="lazy"></li>
      <li class="partner"><img class="partner__img--premier" src="assets/logos/premier.png" alt="PREMIER" width="144" height="18" loading="lazy"></li>
      <li class="partner"><img src="assets/logos/vkusvill.svg" alt="ВкусВилл" width="260" height="144" loading="lazy"></li>

    <div class="partners__controls">
      <div class="arrows arrows--gray">
        <button class="arrows__btn arrows__btn--prev" type="button" data-slider-prev aria-label="Назад"></button>
        <button class="arrows__btn arrows__btn--next" type="button" data-slider-next aria-label="Вперёд"></button>
      </div>
      <a class="btn btn--text" href="#/partners">
        Все партнеры
        <img src="assets/icons/arrow-right.svg" alt="" width="24" height="24">
